openapi: 3.1.0
info:
  title: Mothercat Audit API
  version: 1.0.0
  description: |
    Read-only access to immutable audit events. Both endpoints require an
    authenticated session and the backend-enforced `audit.read` permission.
servers:
  - url: /
    description: Current API host
tags:
  - name: Audit
    description: Search and retrieve immutable audit events
paths:
  /api/v1/audit-events:
    get:
      tags: [Audit]
      operationId: listAuditEvents
      summary: Search audit events
      description: >
        Results are ordered by `occurred_at` descending, then ID descending.
        Timestamp filters are inclusive RFC3339 values.
      security:
        - sessionCookie: []
      x-required-permission: audit.read
      parameters:
        - name: actor_id
          in: query
          schema:
            type: string
            maxLength: 200
        - name: action
          in: query
          schema:
            type: string
            maxLength: 160
        - name: resource_type
          in: query
          schema:
            type: string
            maxLength: 100
        - name: resource_id
          in: query
          schema:
            type: string
            maxLength: 200
        - name: from
          in: query
          description: Inclusive lower bound for occurred_at.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Inclusive upper bound for occurred_at.
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 1000000
            default: 0
      responses:
        "200":
          description: A page of matching audit events
          content:
            application/json:
              schema:
                type: object
                required: [events, page]
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditEvent"
                  page:
                    $ref: "#/components/schemas/Page"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/audit-events/{eventID}:
    get:
      tags: [Audit]
      operationId: getAuditEvent
      summary: Retrieve an audit event
      security:
        - sessionCookie: []
      x-required-permission: audit.read
      parameters:
        - name: eventID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The requested audit event
          content:
            application/json:
              schema:
                type: object
                required: [event]
                properties:
                  event:
                    $ref: "#/components/schemas/AuditEvent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: mothercat_session
  schemas:
    AuditEvent:
      type: object
      required:
        - id
        - actor_type
        - actor_id
        - action
        - resource_type
        - resource_id
        - occurred_at
        - details
      properties:
        id:
          type: string
          format: uuid
        actor_type:
          type: string
        actor_id:
          type: string
        action:
          type: string
        resource_type:
          type: string
        resource_id:
          type: string
        occurred_at:
          type: string
          format: date-time
        details:
          type: object
          additionalProperties: true
    Page:
      type: object
      required: [limit, offset, total]
      properties:
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, request_id]
          properties:
            code:
              type: string
            request_id:
              type: string
  responses:
    BadRequest:
      description: Invalid query parameter or event ID
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: A valid session is required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: The session does not have audit.read permission
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: No audit event exists with the requested ID
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InternalError:
      description: The audit event query failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unavailable:
      description: The database or identity service is unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"