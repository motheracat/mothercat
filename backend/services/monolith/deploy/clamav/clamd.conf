DatabaseDirectory /var/lib/clamav
LogFile /dev/stderr
LogTime yes
Foreground yes
PidFile /run/clamav/clamd.pid
LocalSocket /run/clamav/clamd.ctl
FixStaleSocket yes
LocalSocketGroup clamav
LocalSocketMode 660
TCPSocket 3310
TCPAddr 127.0.0.1
User clamav
StreamMaxLength 12M
MaxThreads 2
MaxConnectionQueueLength 10
ReadTimeout 120
CommandReadTimeout 30
SendBufTimeout 500
MaxScanSize 20M
MaxFileSize 12M
MaxRecursion 10
MaxFiles 1000
ScanArchive yes
