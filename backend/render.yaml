services:
  - type: web
    name: mothercat-api
    runtime: docker
    plan: starter
    dockerfilePath: backend/services/monolith/Dockerfile
    dockerContext: backend
    preDeployCommand: /setup-mongodb
    healthCheckPath: /health/ready
    envVars:
      - key: APP_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: mothercat
      - key: IDENTITY_ONBOARDING_TOKEN
        sync: false
      - key: IDENTITY_BOOTSTRAP_TOKEN
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM_EMAIL
        sync: false
      - key: BREVO_FROM_NAME
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false